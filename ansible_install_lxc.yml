---
- name: Create and configure LXC containers for WordPress
  hosts: localhost
  connection: local
  become: true
  vars:
    template: "local:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst"
    password: "password"
    disk_size: 30
    cores: 1
    memory: 1024
    gateway: "10.24.50.1"
    dns_server: "1.1.1.1"
    bridge: "vmbr0"
    storage: "shared-harddisk-pool"
    username: "ansible"
    base_ip: "10.24.50"

  vars_files:
    - ansible_install_containers.yml

  tasks:
    - name: Check if template exists
      shell: |
        pveam list local | grep -q "ubuntu-22.04-standard_22.04-1_amd64.tar.zst"
      register: template_check
      failed_when: false
      changed_when: false
      run_once: true

    - name: Fail if template does not exist
      fail:
        msg: "Template not found in local storage"
      when: template_check.rc != 0
      run_once: true

    - name: Check if LXC container already exists
      shell: |
        pct status {{ item.ctid }}
      register: container_status
      failed_when: false
      changed_when: false
      loop: "{{ containers }}"

    - name: Stop existing containers
      shell: |
        pct stop {{ item.ctid }}
      loop: "{{ containers }}"
      failed_when: false
      ignore_errors: yes

    - name: Wait for containers to stop
      shell: |
        pct status {{ item.ctid }} | grep -q "running"
      register: wait_stop
      until: wait_stop.rc != 0
      retries: 90
      delay: 1
      loop: "{{ containers }}"
      failed_when: false

    - name: Destroy existing containers
      shell: |
        pct destroy {{ item.ctid }}
      loop: "{{ containers }}"
      failed_when: false

    - name: Create new LXC containers
      shell: |
        pct create {{ item.ctid }} "{{ template }}" \
          --hostname "wordpress-{{ item.ctid }}" \
          --cores {{ cores }} \
          --memory {{ memory }} \
          --rootfs "{{ storage }}:{{ disk_size }}" \
          --unprivileged 1 \
          --net0 "name=eth0,bridge={{ bridge }},ip={{ base_ip }}.{{ item.ctid }}/24,gw={{ gateway }},rate=50" \
          --nameserver "{{ dns_server }}" \
          --password "{{ password }}" \
          --features nesting=1
      loop: "{{ containers }}"

    - name: Start LXC containers
      shell: |
        pct start {{ item.ctid }}
      loop: "{{ containers }}"

    - name: Wait for containers to start
      shell: |
        pct status {{ item.ctid }} | grep -q "running"
      register: wait_start
      until: wait_start.rc == 0
      retries: 90
      delay: 1
      loop: "{{ containers }}"

    - name: Update container packages
      shell: |
        pct exec {{ item.ctid }} -- apt update
      loop: "{{ containers }}"

    - name: Upgrade container packages
      shell: |
        pct exec {{ item.ctid }} -- apt upgrade -y
      loop: "{{ containers }}"

    - name: Install locales
      shell: |
        pct exec {{ item.ctid }} -- apt install -y locales
      loop: "{{ containers }}"

    - name: Generate locale
      shell: |
        pct exec {{ item.ctid }} -- locale-gen en_US.UTF-8
      loop: "{{ containers }}"

    - name: Update locale settings
      shell: |
        pct exec {{ item.ctid }} -- update-locale LANG=en_US.UTF-8
      loop: "{{ containers }}"

    - name: Create ansible user
      shell: |
        pct exec {{ item.ctid }} -- useradd -m -s /bin/bash {{ username }}
      loop: "{{ containers }}"

    - name: Add ansible user to sudoers group
      shell: |
        pct exec {{ item.ctid }} -- usermod -aG sudo {{ username }}
      loop: "{{ containers }}"

    - name: Create SSH directory for ansible user
      shell: |
        pct exec {{ item.ctid }} -- mkdir -p /home/{{ username }}/.ssh
      loop: "{{ containers }}"

    - name: Copy SSH public key to container
      shell: |
        cat ~/.ssh/id_rsa.pub | pct exec {{ item.ctid }} -- bash -c "cat >> /home/{{ username }}/.ssh/authorized_keys"
      loop: "{{ containers }}"

    - name: Set SSH directory ownership
      shell: |
        pct exec {{ item.ctid }} -- chown -R {{ username }}:{{ username }} /home/{{ username }}/.ssh
      loop: "{{ containers }}"

    - name: Set SSH directory permissions
      shell: |
        pct exec {{ item.ctid }} -- chmod 700 /home/{{ username }}/.ssh
      loop: "{{ containers }}"

    - name: Set authorized_keys permissions
      shell: |
        pct exec {{ item.ctid }} -- chmod 600 /home/{{ username }}/.ssh/authorized_keys
      loop: "{{ containers }}"

    - name: Configure passwordless sudo for ansible user
      shell: |
        pct exec {{ item.ctid }} -- bash -c "echo '{{ username }} ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers.d/{{ username }}"
      loop: "{{ containers }}"

    - name: Set sudoers file permissions
      shell: |
        pct exec {{ item.ctid }} -- chmod 440 /etc/sudoers.d/{{ username }}
      loop: "{{ containers }}"

    - name: Install UFW firewall
      shell: |
        pct exec {{ item.ctid }} -- apt install -y ufw
      loop: "{{ containers }}"

    - name: Enable firewall
      shell: |
        pct exec {{ item.ctid }} -- ufw --force enable
      loop: "{{ containers }}"

    - name: Configure firewall defaults
      shell: |
        pct exec {{ item.ctid }} -- ufw default deny incoming
        pct exec {{ item.ctid }} -- ufw default allow outgoing
      loop: "{{ containers }}"

    - name: Allow SSH through firewall
      shell: |
        pct exec {{ item.ctid }} -- ufw allow 22/tcp
      loop: "{{ containers }}"

    - name: Allow HTTP through firewall
      shell: |
        pct exec {{ item.ctid }} -- ufw allow 80/tcp
      loop: "{{ containers }}"

    - name: Allow HTTPS through firewall
      shell: |
        pct exec {{ item.ctid }} -- ufw allow 443/tcp
      loop: "{{ containers }}"

    - name: Display completion message
      debug:
        msg: "LXC {{ item.ctid }} is ready and able (IP: {{ base_ip }}.{{ item.ctid }})"
      loop: "{{ containers }}"